# The same gates the flake runs locally: lint, headless smoke, offscreen
# e2e.  FreeCAD 1.1.1 substitutes from cache.nixos.org (nothing to build).
name: ci
on:
  push:
    branches: [v2-build, master]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: lint
        run: nix develop -c ruff check piemenu dev
      - name: smoke
        run: nix run .#smoke
      - name: e2e
        run: nix run .#e2e
