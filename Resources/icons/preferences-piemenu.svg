    <path stroke="#8b8b8b" d="M 10.3 35.8 A 22 22 0 0 0 28.2 53.7"/>
    <path stroke="#8b8b8b" d="M 35.8 53.7 A 22 22 0 0 0 53.7 35.8"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="#8b8b8b"/>
</svg>
